---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # In-cluster replacement for GitHub's Actions cache, used by the cv-ops
  # runners (see runners/cv-ops/helmrelease.yaml). Restoring the ~1.2 GiB NuGet
  # cache from GitHub took 3-4.5 minutes per job over the home connection.
  # Requests it doesn't handle, such as artifact uploads, are proxied to GitHub.
  name: &name actions-cache-server
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  # One pod on a ReadWriteOnce volume with SQLite: replace it rather than
  # rolling, or the new pod waits on a volume the old one still holds.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: *name
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    fullnameOverride: *name
    config:
      # Runners reach it through the cluster-internal service only. Cache
      # requests are authorised by verifying the job's GitHub-signed token, and
      # entries are scoped per repository and branch like GitHub's own cache.
      apiBaseUrl: http://actions-cache-server.actions-runner-system.svc.cluster.local:3000
      # GitHub evicts entries unused for 7 days; match it.
      cacheCleanupOlderThanDays: 7
      cacheFilesystemMaxUsagePercent: 80
      storage:
        driver: filesystem
      db:
        driver: sqlite
    serviceAccount:
      automount: false
    persistentVolumeClaim:
      storageClassName: ceph-block
      storage: 50Gi
    # The image runs a single Node worker, and while it streams multi-GiB
    # caches that worker blocks for seconds at a time: it forces a full GC
    # after every part and writes SQLite synchronously to Ceph. With the chart's
    # 1s probe timeout the kubelet killed it mid-upload, which abandoned the
    # entry and sent the next job back to GitHub. The liveness probe now only
    # catches a process wedged for minutes, and readiness tolerates a stall
    # instead of dropping the only endpoint.
    livenessProbe:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    resources:
      requests:
        # Chart default. It shares nodes with the cv-ops runners, and 100m
        # gave it little CPU share while they were busy.
        cpu: 500m
        memory: 256Mi
      limits:
        memory: 2Gi
